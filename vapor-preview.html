<!doctype html>
<html lang="th">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Maverick · Vapor study</title>
<style>
*{box-sizing:border-box}body{margin:0;font:14px system-ui,sans-serif;color:#edf0ed;background:#527da0}canvas{display:block;width:100%;height:100%;touch-action:none}#view{position:fixed;inset:0}header{position:fixed;left:28px;top:22px;pointer-events:none}h1{font-size:24px;font-weight:500;margin:0 0 5px}header p{margin:0;opacity:.8}aside{position:fixed;right:20px;top:20px;background:#1c2227;width:260px;padding:20px;max-height:calc(100dvh - 40px);overflow:auto;border:1px solid #3b474e;border-radius:3px}h2{font-size:16px;margin:0 0 15px;font-weight:500}label{display:block;margin-top:14px;color:#adb8be}output{float:right;color:#edf0ed;font-variant-numeric:tabular-nums}input[type=range]{display:block;width:100%;height:28px;accent-color:#cfb88a}button,select{min-height:40px;background:#293239;color:#edf0ed;border:1px solid #3b474e;border-radius:3px;padding:8px;font:inherit}select{width:100%;margin-top:6px}button{cursor:pointer}button:hover{background:#3b474e}:focus-visible{outline:2px solid #cfb88a;outline-offset:3px}.row{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}.row button{flex:1}small{display:block;color:#adb8be;line-height:1.6;margin-top:15px}#status{position:fixed;bottom:22px;left:28px;font-size:12px}#error{color:#ffd1be}details{margin-top:18px}summary{cursor:pointer;min-height:30px}@media(max-width:700px){aside{top:auto;bottom:12px;right:12px;width:220px;max-height:48dvh;padding:14px}header{left:16px;top:16px}#status{left:16px;bottom:auto;top:90px;max-width:200px}}
</style></head>
<body><div id="view"></div><header><h1>F-22 / Condensation</h1><p>เมฆควบแน่นเหนือปีก + เส้นไอน้ำจากปลายปีก</p></header>
<aside aria-label="Vapor controls"><h2>สภาวะการบิน</h2>
<label for="aircraft">เครื่องบิน</label><select id="aircraft"><option value="f22">F-22 Raptor</option><option value="su57">Su-57 Felon</option></select>
<label for="speed">ความเร็ว <output id="speedValue"></output></label><input id="speed" type="range" min="0" max="350" value="183" step="1">
<label for="aoa">AoA <output id="aoaValue"></output></label><input id="aoa" type="range" min="-35" max="100" value="8" step="1">
<label for="g">แรง G <output id="gValue"></output></label><input id="g" type="range" min="1" max="9" value="6.8" step=".1">
<label for="humidity">ความชื้น <output id="humidityValue"></output></label><input id="humidity" type="range" min=".15" max="1" value=".78" step=".01">
<div class="row"><button id="cruise">Cruise</button><button id="highG">High-G</button><button id="alpha">High AoA</button></div>
<div class="row"><button id="combined">Cloud + wingtip vortex</button></div>
<details><summary>ลักษณะเมฆและเส้นไอน้ำ</summary>
<label for="density">Density <output id="densityValue"></output></label><input id="density" type="range" min="0" max="2" value="1" step=".05">
<label for="noise">Noise <output id="noiseValue"></output></label><input id="noise" type="range" min="0" max="1.5" value="1" step=".05">
<label for="turbulence">Turbulence <output id="turbulenceValue"></output></label><input id="turbulence" type="range" min="0" max="2" value="1" step=".05">
<label for="fade">Fade <output id="fadeValue"></output></label><input id="fade" type="range" min=".1" max="2" value=".45" step=".05">
<label for="airflow">Airflow <output id="airflowValue"></output></label><input id="airflow" type="range" min="0" max="2" value="1" step=".05">
</details>
<div class="row"><button id="pause" aria-pressed="false">หยุดการไหล</button><button id="viewReset">รีเซ็ตมุม</button></div>
<div class="row"><button id="top">ด้านบน</button><button id="underside">ด้านล่าง</button><button id="rear">ด้านท้าย</button></div>
<div class="row"><button id="reference">มุมเทียบภาพอ้างอิง</button></div>
<small>ลากเพื่อหมุน · เลื่อนเพื่อซูม<br>จำลองภาพในอากาศชื้น ไม่ใช่ CFD<br>ใช้ระบบเมฆเดียวกับฉากบินจริง</small><p id="error" role="alert"></p></aside><div id="status" role="status">กำลังโหลดโมเดล…</div>
<script type="module" src="/src/render/vapor/preview.ts"></script></body></html>
